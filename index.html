<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cup Shadow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #f4ecdc; -webkit-user-select: none; user-select: none; }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #1b130e; text-align: center; padding: 24px; }
  #start h1 { font-weight: 600; letter-spacing: .02em; margin: 0; font-size: 28px; }
  #start p { margin: 0; opacity: .75; line-height: 1.5; font-size: 15px; max-width: 320px; }
  #go { margin-top: 10px; width: 120px; height: 120px; border-radius: 50%; border: 0; background: #b84626; color: #fff; font-size: 20px; font-weight: 600; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 10; text-align: center; font-size: 15px; pointer-events: none; transition: opacity .4s; }
  #hint span { background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 20px; }
  #err { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; background: #1b130e; line-height: 1.6; }
  /* debug panel. NOTE: must not use id="dbg" (MediaPipe calls a global dbg()) */
  #tune { position: fixed; z-index: 15; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; max-height: 58vh; overflow: auto; background: rgba(0,0,0,.62); border-radius: 10px; padding: 8px; font: 12px/1.35 ui-monospace, Menlo, monospace; display: none; }
  #tune.min .rows, #tune.min .btns2 { display: none; }
  #tune .live { white-space: pre; color: #9fe39f; }
  #tune .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #tune .row b { flex: 1; font-weight: normal; }
  #tune .row i { font-style: normal; color: #ffd27a; min-width: 52px; text-align: right; }
  #tune button { font: inherit; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px 9px; min-width: 32px; }
  #tune .btns, #tune .btns2 { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
</style>
</head>
<body>
<div id="ar"></div>
<div id="start">
  <h1>Cup Shadow</h1>
  <p>כוונו את המצלמה אל הכוס והתחתית.<br>קרבו יד אל הכוס, או נשפו על הטלפון.</p>
  <button id="go">התחלה</button>
  <p style="font-size:12px;opacity:.5">צריך אישור למצלמה ולמיקרופון</p>
</div>
<div id="hint" style="opacity:0"><span>כוונו אל התחתית</span></div>
<div id="err"></div>
<div id="tune"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
